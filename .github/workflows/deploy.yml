name: Build & Deploy SSR Frontend to cPanel (Node/Passenger)

# Builds the Angular SSR app in CI, ships the build output to the cPanel
# Node.js application directory over SSH, then restarts Passenger.
#
# ── Before this workflow can succeed ──────────────────────────────────────
# One-time cPanel setup (cPanel > Setup Node.js App):
#   - Node.js version:          24.x  (match NODE_VENV path below)
#   - Application root:         the path in APP_DIR below
#   - Application URL:          pumziko.org (once the domain is live)
#   - Application startup file: serverForHosting.mjs
#       (a thin Express wrapper around dist/PumzikoFE/server/server.mjs;
#        Passenger needs a fixed filename at the app root)
#   (Creating the app enables the Passenger "tmp/restart.txt" restart hook.)
#
# Add these GitHub secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST      - cPanel server hostname or IP
#   SSH_USERNAME  - cPanel SSH username
#   SSH_KEY       - the PRIVATE SSH key (full contents, incl. BEGIN/END lines)
#   SSH_PORT      - SSH port (often 2222 on cPanel, not 22)
#
# Add this GitHub *variable* (not a secret) so the bundle is built against the
# real API instead of the localhost default in src/environments/environment.ts:
#   API_URL       - e.g. https://api.pumziko.org/api
#   SITE_URL      - e.g. https://pumziko.org   (used for og:url tags)
#
# Until all of the above is done, every run of this workflow will fail —
# that's expected until real hosting is provisioned.
# ────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy (SSR)
    runs-on: ubuntu-latest
    # Non-sensitive deployment paths. Must match the cPanel Node.js App
    # "Application root" and its node virtualenv path exactly.
    env:
      APP_DIR: /home/htobgkjd/pumziko.org
      NODE_VENV: /home/htobgkjd/nodevenv/pumziko.org/24/bin
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Point the build at the production API
        if: vars.API_URL != ''
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '${{ vars.API_URL }}',
            appName: 'Pumziko',
            siteUrl: '${{ vars.SITE_URL || 'https://pumziko.org' }}',
            version: '1.0.0',
          };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build SSR (browser + server bundles)
        run: npm run build

      # Upload the build output, the runtime manifest, and the Passenger entry
      # wrapper. Passenger boots serverForHosting.mjs, which serves the static
      # assets and SSR via the handler exported by dist/PumzikoFE/server/server.mjs.
      #
      # Streamed as a tarball through the runner's native OpenSSH client rather
      # than appleboy/scp-action: its Go SSH library trips over a packet cPanel's
      # sshd sends when opening a second channel ("ssh: unexpected packet in
      # response to channel open"). The native client opens one channel and works.
      - name: Upload build to cPanel (${{ env.APP_DIR }})
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes"
          tar czf - dist package.json package-lock.json serverForHosting.mjs \
            | $SSH "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
                "mkdir -p '${{ env.APP_DIR }}' && tar xzf - -C '${{ env.APP_DIR }}'"

      - name: Install production deps & restart Passenger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ env.APP_DIR }}"
            # Use the cPanel Node virtualenv so node/npm match the app.
            if [ -f "${{ env.NODE_VENV }}/activate" ]; then
              source "${{ env.NODE_VENV }}/activate"
            fi
            # Runtime deps the SSR server loads (express, @angular/*, rxjs, …).
            npm ci --omit=dev || npm install --omit=dev
            # Trigger a Passenger restart.
            mkdir -p tmp && touch tmp/restart.txt
